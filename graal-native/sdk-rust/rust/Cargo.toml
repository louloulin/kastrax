[package]
name = "kastrax"
version = "0.1.0"
edition = "2021"
description = "Rust SDK for KastraX AI Agent Framework"
license = "MIT"
repository = "https://github.com/kastrax/kastrax"
documentation = "https://docs.rs/kastrax"
readme = "README.md"

[lib]
name = "kastrax_rust"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
