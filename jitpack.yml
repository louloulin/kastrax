# JitPack配置文件
# 指定JDK版本
jdk:
  - openjdk17

# 构建前脚本
before_install:
  - echo "准备构建Kastrax项目..."

# 自定义安装脚本
install:
  - echo "开始构建Kastrax项目..."
  - echo "Group: ai.kastrax"
  - echo "Version: 0.1.0"
  - ./gradlew clean build publishToMavenLocal -x test --info

# 构建后脚本
after_success:
  - echo "构建成功完成!"

# 环境变量
env:
  - GRADLE_OPTS="-Xmx2g -XX:MaxMetaspaceSize=512m"
