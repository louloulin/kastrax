name: Publish to Maven Central

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish'
        required: true
        default: '0.1.0'
      snapshot:
        description: 'Publish as snapshot'
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v3
      with:
        gradle-home-cache-cleanup: true

    - name: Validate Gradle wrapper
      uses: gradle/wrapper-validation-action@v2

    - name: Cache Gradle dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Set version
      if: github.event_name == 'workflow_dispatch'
      run: |
        if [ "${{ github.event.inputs.snapshot }}" == "true" ]; then
          sed -i 's/VERSION_NAME=.*/VERSION_NAME=${{ github.event.inputs.version }}-SNAPSHOT/' gradle.properties
        else
          sed -i 's/VERSION_NAME=.*/VERSION_NAME=${{ github.event.inputs.version }}/' gradle.properties
        fi

    - name: Run tests
      run: ./gradlew test --no-daemon

    - name: Build project
      run: ./gradlew build -x test --no-daemon

    - name: Publish to Maven Central
      env:
        MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
        MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
        SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        SIGNING_SECRET_KEY: ${{ secrets.SIGNING_SECRET_KEY }}
      run: |
        ./gradlew publishToMavenCentral --no-daemon --no-configuration-cache

    - name: Upload build reports
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-reports
        path: |
          **/build/reports/
          **/build/test-results/
        retention-days: 7