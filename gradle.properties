# Gradle性能优化配置
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Gradle构建优化
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Kotlin编译优化
kotlin.incremental=true
kotlin.stdlib.default.dependency=false

# Maven发布配置
# 项目基本信息
GROUP=ai.kastrax
VERSION_NAME=0.1.0

# POM信息
POM_NAME=Kastrax AI Framework
POM_DESCRIPTION=A comprehensive AI framework for building intelligent applications
POM_INCEPTION_YEAR=2024
POM_URL=https://github.com/louloulin/kastrax

# 许可证信息
POM_LICENCE_NAME=Apache License 2.0
POM_LICENCE_URL=https://www.apache.org/licenses/LICENSE-2.0
POM_LICENCE_DIST=repo

# 开发者信息
POM_DEVELOPER_ID=louloulin
POM_DEVELOPER_NAME=louloulin
POM_DEVELOPER_EMAIL=729883852@qq.com

# SCM信息
POM_SCM_URL=https://github.com/louloulin/kastrax
POM_SCM_CONNECTION=scm:git:https://github.com/louloulin/kastrax.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://github.com/louloulin/kastrax.git

# 发布配置
RELEASE_SIGNING_ENABLED=true
SONATYPE_HOST=CENTRAL_PORTAL

# 自动发布到Maven Central（可选，设置为false需要手动在Portal中发布）
SONATYPE_AUTOMATIC_RELEASE=false
